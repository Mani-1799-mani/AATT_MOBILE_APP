# Cloud macOS iOS build: Windows -> GitHub -> macos-latest -> IPA
#
# Run from GitHub: Actions -> Build iOS IPA -> Run workflow
#
# A store-ready IPA needs these GitHub Actions secrets:
#   BUILD_CERTIFICATE_BASE64          base64 of Apple Distribution .p12
#   P12_PASSWORD                      password for that .p12
#   BUILD_PROVISION_PROFILE_BASE64    base64 of App Store .mobileprovision
#   APPLE_TEAM_ID                     10-character Team ID (this app: B5U6YJ64WV)
#   KEYCHAIN_PASSWORD                 any random password for the runner keychain
#
# Optional TestFlight upload (also check "Upload to TestFlight"):
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY         contents of the AuthKey_XXXX.p8 file
#
# On Windows, encode files in PowerShell:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\path\cert.p12"))
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\path\profile.mobileprovision"))

name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload signed IPA to TestFlight
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-ipa.yml'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_ipa:
    name: Flutter iOS IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Detect signing secrets
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found. Building a signed App Store IPA."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are missing. Building an unsigned IPA for compile verification."
          fi

      - name: Install Apple certificate and provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-github-actions-temp}"
          TEAM_ID="${APPLE_TEAM_ID:-B5U6YJ64WV}"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$PP_PATH" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.palatenetworks.aatt</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS=$RUNNER_TEMP/ExportOptions.plist" >> "$GITHUB_ENV"

      - name: Build signed IPA
        if: steps.signing.outputs.enabled == 'true'
        run: |
          flutter build ipa --release --export-options-plist="$EXPORT_OPTIONS"

      - name: Build unsigned IPA
        if: steps.signing.outputs.enabled != 'true'
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          APP_PATH=$(find build/ios -name 'Runner.app' -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app was not produced."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          mkdir -p build/ios/ipa
          (cd "$RUNNER_TEMP" && zip -r "$GITHUB_WORKSPACE/build/ios/ipa/aatt-unsigned.ipa" Payload)
          echo "Unsigned IPA written to build/ios/ipa/aatt-unsigned.ipa"
          echo "This file compiles the app but is not App Store signed. Add the signing secrets to produce a store IPA."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: aatt-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: >
          steps.signing.outputs.enabled == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.upload_to_testflight == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_STORE_CONNECT_API_KEY_ID:-}" ] || [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ] || [ -z "${APP_STORE_CONNECT_API_KEY:-}" ]; then
            echo "TestFlight secrets are missing."
            exit 1
          fi
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n 1)
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcrun altool --upload-app --type ios -f "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/private_keys/"AuthKey_*.p8
